<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Gaming Network - 3D Battlefield</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f13;
            font-family: monospace;
        }
        #game-canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
        }
        .hud-panel {
            background: rgba(15, 15, 19, 0.7);
            border: 1px solid #333344;
            padding: 10px 15px;
            border-radius: 4px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(0, 255, 128, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #scope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.95) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #scope-crosshair {
            width: 100px;
            height: 100px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            position: relative;
        }
        #scope-crosshair::before {
            content: '';
            position: absolute;
            top: 49%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff00;
        }
        #scope-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 49%;
            width: 2px;
            height: 100%;
            background: #00ff00;
        }
        .hidden { display: none !important; }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 28, 0.9);
            border: 1px solid #555577;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-canvas-container"></div>

<div id="ui-overlay">
    <div style="display: flex; justify-content: space-between;">
        <div class="hud-panel">HEALTH: <span id="health-val">100</span>%</div>
        <div class="hud-panel">OBJECTIVE: SURVIVE & ELIMINATE</div>
        <div class="hud-panel">AMMO: 30 / 90 (M16)</div>
    </div>
    <div style="display: flex; justify-content: space-between;">
        <div class="hud-panel">CONTROLS: WASD = Move | Mouse = Look | Left-Click = Shoot | Right-Click = Scope | G = Grenade</div>
        <div class="hud-panel"><a href="../../index.html" style="color: #00ff88; text-decoration: none;">EXIT TO HUB</a></div>
    </div>
</div>

<div id="crosshair"></div>

<div id="scope-overlay" class="hidden">
    <div id="scope-crosshair"></div>
</div>

<div id="instructions">
    <h2>3D BATTLEFIELD ARENA</h2>
    <p>Click anywhere to capture mouse and start combat.</p>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module" src="./game.js"></script>
</body>
</html>
