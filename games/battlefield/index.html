<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Gaming Network - 3D Battlefield</title>
    <style>
        :root {
            --bg-primary: #120d16;
            --bg-secondary: rgba(30, 21, 38, 0.92);
            --accent-burgundy: #581c87;
            --accent-glow: #9333ea;
            --text-main: #f3e8ff;
            --text-muted: #c084fc;
            --border-color: #3b204e;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
        }

        #game-canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Professional Sidebar Menu */
        #lobby-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 460px;
            height: 100%;
            background: var(--bg-secondary);
            backdrop-filter: blur(12px);
            border-right: 2px solid var(--border-color);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        .menu-header h1 {
            margin: 0 0 5px 0;
            color: #e9d5ff;
            font-size: 1.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
        }

        .menu-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Character & Weapon Preview Window */
        #character-preview-container {
            width: 100%;
            height: 180px;
            background: #0b070f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }

        .section-group {
            margin: 12px 0;
            text-align: left;
        }

        .section-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .option-btn {
            background: #171021;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: var(--accent-burgundy);
            border-color: var(--accent-glow);
        }

        .option-btn.active {
            background: var(--accent-glow);
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.8);
        }

        .launch-btn {
            background: linear-gradient(135deg, #7e22ce, #581c87);
            border: 1px solid #a855f7;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .launch-btn:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        /* In-Game HUD */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .hud-panel {
            background: rgba(18, 13, 22, 0.85);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            backdrop-filter: blur(5px);
            font-weight: 600;
            font-size: 0.9rem;
            pointer-events: auto;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(168, 85, 247, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        #scope-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 25%, rgba(10, 5, 15, 0.96) 65%);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 6;
        }

        #scope-crosshair {
            width: 120px;
            height: 120px;
            border: 2px solid #a855f7;
            border-radius: 50%;
            position: relative;
        }

        #scope-crosshair::before {
            content: '';
            position: absolute;
            top: 49%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #a855f7;
        }

        #scope-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 49%;
            width: 2px;
            height: 100%;
            background: #a855f7;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Sidebar Tactical Menu -->
<div id="lobby-menu">
    <div class="menu-header">
        <h1>Omni Tactical 3D</h1>
        <p>First-Person Combat Simulator</p>
    </div>

    <div style="flex-grow: 1; overflow-y: auto; padding-right: 5px;">
        <div class="section-group">
            <label>Loadout Preview</label>
            <div id="character-preview-container"></div>
        </div>

        <div class="section-group">
            <label>Select Map Ground</label>
            <div class="options-grid" id="map-selector">
                <button class="option-btn active" data-map="city">City Ruins</button>
                <button class="option-btn" data-map="forest">Forest</button>
                <button class="option-btn" data-map="bunker">Bunker</button>
            </div>
        </div>

        <div class="section-group">
            <label>Combat Game Mode</label>
            <div class="options-grid" id="mode-selector">
                <button class="option-btn active" data-mode="solo">Solo</button>
                <button class="option-btn" data-mode="zombie">Zombies</button>
                <button class="option-btn" data-mode="multiplayer">Online</button>
            </div>
        </div>

        <div class="section-group">
            <label>Graphics Quality</label>
            <div class="options-grid" id="graphics-selector">
                <button class="option-btn active" data-gfx="high">High</button>
                <button class="option-btn" data-gfx="performance">Max FPS</button>
            </div>
        </div>
    </div>

    <div>
        <button class="launch-btn" id="start-deployment-btn">Deploy to Battlefield</button>
    </div>
</div>

<div id="game-canvas-container"></div>

<div id="ui-overlay" class="hidden">
    <div style="display: flex; justify-content: space-between;">
        <div class="hud-panel">HEALTH: <span id="health-val">100</span>%</div>
        <div class="hud-panel" id="hud-mode">MODE: SOLO SURVIVAL</div>
        <div class="hud-panel">AMMO: <span id="ammo-val">30 / 90 (M16)</span></div>
    </div>
    <div style="display: flex; justify-content: space-between;">
        <div class="hud-panel">WASD = Move | Mouse = Look | Left-Click = Shoot | Right-Click = Scope | 1/2 = Weapon | G = Grenade</div>
        <div class="hud-panel"><a href="../../index.html" style="color: #c084fc; text-decoration: none;">EXIT TO HUB</a></div>
    </div>
</div>

<div id="crosshair" class="hidden"></div>

<div id="scope-overlay" class="hidden">
    <div id="scope-crosshair"></div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module" src="./main.js"></script>
</body>
</html>
