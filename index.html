<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Gaming Network | Web Gaming Hub</title>
    <link rel="stylesheet" href="css/portal.css">
</head>
<body>

<!-- Header Navigation -->
<header>
    <div class="logo-container">
        <div class="logo-icon">Ω</div>
        <span class="logo-text">Omni Gaming Network</span>
    </div>
    <div class="nav-links">
        <button class="nav-btn" onclick="openLeaderboardModal()">Leaderboard</button>
        <button class="nav-btn" onclick="promptSignIn()">Sign In</button>
        <button class="nav-btn primary" onclick="alert('Check CONTRIBUTING.md to submit your own game via GitHub PR or URL!')">Submit Game</button>
    </div>
</header>

<!-- Main Content Area -->
<main>
    <section class="hero">
        <h1>Play, Compete & Build</h1>
        <p>Explore high-performance single-player, 1v1, and multiplayer web games created by independent developers.</p>
    </section>

    <!-- Category Filters -->
    <div class="filters">
        <button class="filter-chip active" onclick="filterGames('all')">All Games</button>
        <button class="filter-chip" onclick="filterGames('Single Player')">Single Player</button>
        <button class="filter-chip" onclick="filterGames('1v1')">1v1 Battles</button>
        <button class="filter-chip" onclick="filterGames('Multiplayer')">Multiplayer</button>
    </div>

    <!-- Dynamic Game Grid (Populated via portal.js & registry.json) -->
    <div class="game-grid" id="game-grid">
        <!-- Game cards injected dynamically -->
    </div>
</main>

<!-- Fullscreen Game Modal Container -->
<div id="game-modal">
    <div class="modal-header">
        <span class="modal-title" id="modal-game-title">Game Title</span>
        <button class="close-modal-btn" onclick="closeGameModal()">Exit Game</button>
    </div>
    <div class="modal-body" id="modal-iframe-container">
        <!-- Iframe injected dynamically -->
    </div>
</div>

<!-- Global Leaderboard Modal -->
<div id="leaderboard-modal" class="modal-backdrop" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 15, 25, 0.98); z-index: 1000; display: none; flex-direction: column;">
    <div class="modal-header" style="background: var(--card-slate); border-bottom: 1px solid var(--border-slate); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <span class="modal-title">🏆 Global Leaderboard Rankings</span>
        <button class="close-modal-btn" onclick="closeLeaderboardModal()">Close</button>
    </div>
    <div style="flex: 1; max-width: 700px; width: 100%; margin: 0 auto; padding: 2rem; overflow-y: auto;" id="leaderboard-list-container">
        <!-- Rankings injected dynamically via leaderboard.js -->
    </div>
</div>

<footer>
    <p>&copy; 2026 Omni Gaming Network. Built for open-source web creators.</p>
</footer>

<!-- Scripts -->
<script src="js/auth.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
