<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Ember - Arcade Shooter</title>
    <!-- Tailwind CSS for styling UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern CSS Custom Properties & Reset */
        :root {
            --bg-dark: #0f0b12;
            --slate-panel: #18121e;
            --burgundy-primary: #800020;
            --burgundy-dark: #4a000b;
            --burgundy-glow: rgba(128, 0, 32, 0.6);
            --gold-accent: #ffd700;
            --amber-glow: #ffbf00;
            --coral-accent: #ff5555;
            --purple-accent: #a855f7;
            --text-light: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-light);
        }

        /* Canvas Fullscreen Layout */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0f24 0%, #08040a 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Glassmorphism Styling for Overlays */
        .glass-panel {
            background: rgba(24, 18, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.67), inset 0 0 15px rgba(128, 0, 32, 0.3);
        }

        .burgundy-btn {
            background: linear-gradient(135deg, var(--burgundy-primary) 0%, var(--burgundy-dark) 100%);
            border: 1px solid var(--gold-accent);
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(128, 0, 32, 0.4);
        }

        .burgundy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4), 0 0 15px var(--burgundy-glow);
            filter: brightness(1.15);
        }

        .burgundy-btn:active {
            transform: translateY(1px);
        }

        /* UI Glow Text Effects */
        .gold-glow-text {
            color: var(--gold-accent);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 191, 0, 0.4);
        }

        .burgundy-glow-text {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(128, 0, 32, 0.8), 0 0 20px rgba(255, 51, 102, 0.5);
        }

        /* On-screen Mobile Controls */
        .touch-btn {
            background: rgba(128, 0, 32, 0.4);
            border: 1px solid var(--gold-accent);
            border-radius: 50%;
            touch-action: none;
        }

        .touch-btn:active {
            background: rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Layer -->
    <div id="hud-overlay" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none hidden">
        <!-- Score & Multiplier -->
        <div class="flex flex-col gap-1">
            <div class="text-xs uppercase tracking-widest text-amber-200/70 font-bold">Score</div>
            <div id="score-val" class="text-3xl font-extrabold gold-glow-text">0</div>
            <div id="multiplier-tag" class="text-xs text-amber-400 font-semibold opacity-0 transition-opacity">1.0x MULTIPLIER</div>
        </div>

        <!-- Health Bar & Shield Status -->
        <div class="flex flex-col items-end gap-2 w-48 sm:w-64">
            <div class="flex justify-between w-full text-xs uppercase tracking-widest text-amber-200/70 font-bold">
                <span>Hull Integrity</span>
                <span id="hp-percent">100%</span>
            </div>
            <div class="w-full bg-slate-900/80 rounded-full h-3 border border-amber-500/30 overflow-hidden p-0.5">
                <div id="hp-bar" class="h-full rounded-full transition-all duration-300" style="width: 100%; background: linear-gradient(90deg, #800020, #ff4500, #ffd700);"></div>
            </div>
            <div id="active-powerups" class="flex gap-2 mt-1"></div>
        </div>
    </div>

    <!-- Start / Game Over Overlay Screens -->
    <div id="menu-overlay" class="absolute inset-0 flex items-center justify-center p-4 z-10">
        <div class="glass-panel p-8 sm:p-10 rounded-2xl max-w-md w-full text-center flex flex-col items-center">
            <h1 id="menu-title" class="text-4xl sm:text-5xl font-black tracking-wider mb-2 gold-glow-text italic">NEON EMBER</h1>
            <p id="menu-subtitle" class="text-sm text-amber-200/80 mb-6 uppercase tracking-widest">Tactical Space Arcade Shooter</p>

            <div id="score-summary" class="hidden my-4 w-full bg-black/40 p-4 rounded-xl border border-amber-500/20 text-left">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-400">Final Score:</span>
                    <span id="final-score" class="font-bold gold-glow-text text-xl">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">High Score:</span>
                    <span id="high-score" class="font-bold text-amber-300 text-xl">0</span>
                </div>
            </div>

            <div class="text-xs text-amber-100/70 mb-6 space-y-1 text-center">
                <p><span class="text-amber-400 font-bold">WASD / Arrows</span> or <span class="text-amber-400 font-bold">Touch Drag</span> to Move</p>
                <p><span class="text-amber-400 font-bold">SPACE</span> or <span class="text-amber-400 font-bold">Auto-Fire</span> to Shoot</p>
                <p><span class="text-amber-400 font-bold">P</span> to Pause Game</p>
            </div>

            <button id="start-btn" class="burgundy-btn px-8 py-3.5 rounded-xl font-bold text-lg w-full tracking-wider uppercase">
                Launch Fighter
            </button>
        </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="absolute inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center hidden z-20">
        <div class="glass-panel p-8 rounded-2xl text-center max-w-xs w-full">
            <h2 class="text-3xl font-bold gold-glow-text mb-4">SYSTEM PAUSED</h2>
            <p class="text-xs text-gray-300 mb-6">Press P or tap resume to continue fight</p>
            <button id="resume-btn" class="burgundy-btn px-6 py-2.5 rounded-xl font-bold w-full uppercase">
                Resume Mission
            </button>
        </div>
    </div>

    <!-- On-Screen Controls for Mobile Devices -->
    <div id="touch-controls" class="absolute bottom-6 left-6 right-6 flex justify-between items-end pointer-events-none hidden md:hidden">
        <!-- Joystick Zone simulated by touch drag on canvas -->
        <div class="text-xs text-amber-200/50 bg-black/40 px-3 py-1.5 rounded-full backdrop-blur">
            Drag to Pilot Fighter
        </div>
        <button id="touch-fire" class="touch-btn w-16 h-16 pointer-events-auto flex items-center justify-center text-amber-300 font-bold shadow-lg">
            FIRE
        </button>
    </div>
</div>

<!-- MAIN GAME LOGIC SCRIPT -->
<script>
    /**
     * Web Audio Synthesizer for Retro Sound Effects (Zero External Audio Assets)
     */
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.muted = false;
        }

        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playLaser() {
            if (this.muted || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);

            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        }

        playExplosion(type = 'small') {
            if (this.muted || !this.ctx) return;
            const dur = type === 'boss' ? 0.8 : type === 'medium' ? 0.4 : 0.2;
            const bufferSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(type === 'boss' ? 300 : 600, this.ctx.currentTime);
            filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + dur);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(type === 'boss' ? 0.4 : 0.25, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            noise.start();
        }

        playPowerup() {
            if (this.muted || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);

            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + 0.25);
        }

        playHit() {
            if (this.muted || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        }
    }

    const audio = new SoundEngine();

    /**
     * Engine & Game Loop Logic
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game State Variables
    let width, height;
    let isRunning = false;
    let isPaused = false;
    let score = 0;
    let highScore = localStorage.getItem('neon_ember_highscore') || 0;
    let lastTime = 0;
    let spawnTimer = 0;
    let powerupTimer = 0;

    // Input Trackers
    const keys = {};
    const touchState = { active: false, x: 0, y: 0, firing: false };

    // Entities Containers
    let player;
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];
    let stars = [];

    // Resize Canvas and recalculate boundaries
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        if (player) {
            player.x = Math.min(Math.max(player.x, player.radius), width - player.radius);
            player.y = Math.min(Math.max(player.y, player.radius), height - player.radius);
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Background Starfield Generation
    function initStars() {
        stars = [];
        const count = Math.floor((width * height) / 3000);
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.2,
                color: Math.random() > 0.8 ? '#ffd700' : Math.random() > 0.5 ? '#800020' : '#4a5568'
            });
        }
    }

    /**
     * Entity Classes
     */
    class Player {
        constructor() {
            this.radius = 22;
            this.x = width / 2;
            this.y = height - 120;
            this.speed = 450; // Dynamic movement speed
            this.hp = 100;
            this.maxHp = 100;
            this.shield = 0;
            this.maxShield = 100;
            this.fireRate = 0.13; // seconds per shot
            this.fireCooldown = 0;
            this.tripleShotTime = 0;
            this.rapidFireTime = 0;
            this.invulnerableTime = 0;
        }

        update(dt) {
            // Handle Movement
            let dx = 0;
            let dy = 0;

            if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
            if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
            if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
            if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

            // Normalize diagonal vector
            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            this.x += dx * this.speed * dt;
            this.y += dy * this.speed * dt;

            // Touch drag position smooth tracking
            if (touchState.active) {
                const targetX = touchState.x;
                const targetY = touchState.y - 40; // Offset finger location
                this.x += (targetX - this.x) * 0.2;
                this.y += (targetY - this.y) * 0.2;
            }

            // Screen Clamping
            this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
            this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

            // Timers
            if (this.fireCooldown > 0) this.fireCooldown -= dt;
            if (this.tripleShotTime > 0) this.tripleShotTime -= dt;
            if (this.rapidFireTime > 0) this.rapidFireTime -= dt;
            if (this.invulnerableTime > 0) this.invulnerableTime -= dt;

            // Firing logic
            const wantsToFire = keys['Space'] || touchState.firing || touchState.active;
            const effectiveFireRate = this.rapidFireTime > 0 ? this.fireRate * 0.5 : this.fireRate;

            if (wantsToFire && this.fireCooldown <= 0) {
                this.shoot();
                this.fireCooldown = effectiveFireRate;
            }

            // Thruster Particles
            particles.push(new Particle(
                this.x + (Math.random() - 0.5) * 8,
                this.y + this.radius - 2,
                (Math.random() - 0.5) * 20,
                Math.random() * 100 + 150,
                Math.random() * 3 + 2,
                '#ffd700',
                0.3
            ));
        }

        shoot() {
            audio.playLaser();
            if (this.tripleShotTime > 0) {
                bullets.push(new Bullet(this.x, this.y - 15, 0, -800, '#ffd700', true));
                bullets.push(new Bullet(this.x - 12, this.y - 10, -150, -750, '#ffbf00', true));
                bullets.push(new Bullet(this.x + 12, this.y - 10, 150, -750, '#ffbf00', true));
            } else {
                bullets.push(new Bullet(this.x - 8, this.y - 15, 0, -800, '#ffd700', true));
                bullets.push(new Bullet(this.x + 8, this.y - 15, 0, -800, '#ffd700', true));
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Flash when hit/invulnerable
            if (this.invulnerableTime > 0 && Math.floor(Date.now() / 50) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Custom Futuristic Fighter Rendering
            // Shield Outer Glow
            if (this.shield > 0) {
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(168, 85, 247, ${0.4 + Math.sin(Date.now() / 150) * 0.2})`;
                ctx.lineWidth = 3;
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 12;
                ctx.stroke();
            }

            // Ship Hull Body
            ctx.beginPath();
            ctx.moveTo(0, -this.radius - 4);
            ctx.lineTo(this.radius + 2, this.radius);
            ctx.lineTo(this.radius / 2, this.radius - 6);
            ctx.lineTo(0, this.radius + 2);
            ctx.lineTo(-this.radius / 2, this.radius - 6);
            ctx.lineTo(-this.radius - 2, this.radius);
            ctx.closePath();

            // Gold & Burgundy Metallic Gradient
            const gradient = ctx.createLinearGradient(0, -this.radius, 0, this.radius);
            gradient.addColorStop(0, '#ffd700');
            gradient.addColorStop(0.4, '#800020');
            gradient.addColorStop(1, '#4a000b');

            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Cockpit Core
            ctx.beginPath();
            ctx.ellipse(0, -2, 5, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#ffbf00';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.fill();

            ctx.restore();
        }

        takeDamage(amount) {
            if (this.invulnerableTime > 0) return;

            audio.playHit();
            if (this.shield > 0) {
                this.shield -= amount;
                if (this.shield < 0) {
                    this.hp += this.shield; // Overflow to HP
                    this.shield = 0;
                }
            } else {
                this.hp -= amount;
            }

            this.invulnerableTime = 0.6; // Invulnerability frames

            // Hit Particle Burst
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(
                    this.x, this.y,
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 200,
                    Math.random() * 4 + 2,
                    '#ff3366',
                    0.4
                ));
            }

            if (this.hp <= 0) {
                this.hp = 0;
                gameOver();
            }
        }
    }

    class Bullet {
        constructor(x, y, vx, vy, color = '#ffd700', isPlayer = false) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.radius = isPlayer ? 3.5 : 4.5;
            this.color = color;
            this.isPlayer = isPlayer;
            this.markedForDeletion = false;
        }

        update(dt) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;

            if (this.x < -20 || this.x > width + 20 || this.y < -20 || this.y > height + 20) {
                this.markedForDeletion = true;
            }
        }

        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
        }
    }

    class Enemy {
        constructor(type) {
            this.type = type; // 'scout', 'interceptor', 'heavy'
            this.markedForDeletion = false;
            this.x = Math.random() * (width - 80) + 40;
            this.y = -40;

            if (type === 'scout') {
                this.radius = 16;
                this.hp = 2;
                this.maxHp = 2;
                this.speed = Math.random() * 80 + 180;
                this.color = '#ff5555';
                this.scoreValue = 100;
                this.fireTimer = Math.random() * 2;
            } else if (type === 'interceptor') {
                this.radius = 22;
                this.hp = 5;
                this.maxHp = 5;
                this.speed = Math.random() * 50 + 120;
                this.color = '#ffbf00';
                this.scoreValue = 250;
                this.fireTimer = Math.random() * 1.5;
                this.angle = 0;
            } else if (type === 'heavy') {
                this.radius = 36;
                this.hp = 18;
                this.maxHp = 18;
                this.speed = 60;
                this.color = '#800020';
                this.scoreValue = 600;
                this.fireTimer = 1.0;
            }
        }

        update(dt) {
            this.y += this.speed * dt;

            // Movement Logic Variances
            if (this.type === 'interceptor') {
                this.angle += dt * 3;
                this.x += Math.sin(this.angle) * 2;
            }

            // Enemy Shooting Behavior
            this.fireTimer -= dt;
            if (this.fireTimer <= 0) {
                this.shoot();
                this.fireTimer = this.type === 'heavy' ? 1.5 : this.type === 'interceptor' ? 2.0 : 3.0;
            }

            if (this.y > height + 50) {
                this.markedForDeletion = true;
            }
        }

        shoot() {
            if (this.y < 20 || this.y > height - 100) return;

            if (this.type === 'scout') {
                enemyBullets.push(new Bullet(this.x, this.y + this.radius, 0, 320, '#ff5555', false));
            } else if (this.type === 'interceptor') {
                // Aim toward player position
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                const speed = 280;
                enemyBullets.push(new Bullet(
                    this.x, this.y + this.radius,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    '#ffbf00',
                    false
                ));
            } else if (this.type === 'heavy') {
                // Spread shot
                for (let i = -1; i <= 1; i++) {
                    enemyBullets.push(new Bullet(
                        this.x + i * 12, this.y + this.radius,
                        i * 80, 250,
                        '#ff3366',
                        false
                    ));
                }
            }
        }

        takeDamage(amount) {
            this.hp -= amount;
            audio.playHit();

            // Sparkles on hit
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(
                    this.x, this.y,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    Math.random() * 3 + 1,
                    this.color,
                    0.2
                ));
            }

            if (this.hp <= 0) {
                this.destroy();
            }
        }

        destroy() {
            this.markedForDeletion = true;
            score += this.scoreValue;
            audio.playExplosion(this.type === 'heavy' ? 'medium' : 'small');

            // Explosion Particle Effect
            const particleCount = this.type === 'heavy' ? 35 : 15;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 50;
                particles.push(new Particle(
                    this.x, this.y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    Math.random() * 4 + 2,
                    Math.random() > 0.5 ? '#ffd700' : '#800020',
                    Math.random() * 0.4 + 0.3
                ));
            }

            // Chance to drop power-up
            if (Math.random() < 0.22) {
                spawnPowerup(this.x, this.y);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'scout') {
                // Triangle Scout Shape
                ctx.beginPath();
                ctx.moveTo(0, this.radius);
                ctx.lineTo(-this.radius, -this.radius);
                ctx.lineTo(this.radius, -this.radius);
                ctx.closePath();
                ctx.fillStyle = '#4a000b';
                ctx.fill();
                ctx.strokeStyle = '#ff5555';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (this.type === 'interceptor') {
                // Diamond Interceptor
                ctx.beginPath();
                ctx.moveTo(0, this.radius);
                ctx.lineTo(this.radius, 0);
                ctx.lineTo(0, -this.radius);
                ctx.lineTo(-this.radius, 0);
                ctx.closePath();
                ctx.fillStyle = '#800020';
                ctx.fill();
                ctx.strokeStyle = '#ffbf00';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (this.type === 'heavy') {
                // Octagonal Heavy Cruiser
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    const px = Math.cos(angle) * this.radius;
                    const py = Math.sin(angle) * this.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fillStyle = '#18121e';
                ctx.fill();
                ctx.strokeStyle = '#800020';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Inner glowing core
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#ff3366';
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 10;
                ctx.fill();
            }

            // Health Bar for Heavy
            if (this.type === 'heavy' && this.hp < this.maxHp) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-20, -this.radius - 12, 40, 5);
                ctx.fillStyle = '#ff3366';
                ctx.fillRect(-20, -this.radius - 12, (this.hp / this.maxHp) * 40, 5);
            }

            ctx.restore();
        }
    }

    class Powerup {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'health', 'shield', 'triple', 'rapid'
            this.radius = 14;
            this.vy = 100;
            this.markedForDeletion = false;
            this.pulse = 0;
        }

        update(dt) {
            this.y += this.vy * dt;
            this.pulse += dt * 5;
            if (this.y > height + 30) this.markedForDeletion = true;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            const scale = 1 + Math.sin(this.pulse) * 0.15;
            ctx.scale(scale, scale);

            let color = '#ffd700';
            let label = 'P';
            if (this.type === 'health') { color = '#ff4500'; label = 'H'; }
            else if (this.type === 'shield') { color = '#a855f7'; label = 'S'; }
            else if (this.type === 'triple') { color = '#ffd700'; label = '3'; }
            else if (this.type === 'rapid') { color = '#ffbf00'; label = 'R'; }

            // Outer Glowing Orb
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(24, 18, 30, 0.8)';
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.stroke();

            // Icon Letter
            ctx.font = 'bold 12px sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, 1);

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, vx, vy, radius, color, life) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.radius = radius;
            this.color = color;
            this.life = life;
            this.maxLife = life;
            this.markedForDeletion = false;
        }

        update(dt) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.life -= dt;
            if (this.life <= 0) this.markedForDeletion = true;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.restore();
        }
    }

    function spawnPowerup(x, y) {
        const types = ['health', 'shield', 'triple', 'rapid'];
        const chosen = types[Math.floor(Math.random() * types.length)];
        powerups.push(new Powerup(x, y, chosen));
    }

    /**
     * Collision Detection Utility (Circle vs Circle)
     */
    function checkCollision(c1, c2) {
        const dx = c1.x - c2.x;
        const dy = c1.y - c2.y;
        const distSq = dx * dx + dy * dy;
        const minDist = c1.radius + c2.radius;
        return distSq < minDist * minDist;
    }

    /**
     * Spawning Engine Logic
     */
    function handleSpawns(dt) {
        spawnTimer += dt;
        // Progressive difficulty ramp
        const spawnInterval = Math.max(0.4, 1.8 - (score / 10000));

        if (spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            const rand = Math.random();
            if (rand < 0.55) {
                enemies.push(new Enemy('scout'));
            } else if (rand < 0.85) {
                enemies.push(new Enemy('interceptor'));
            } else {
                enemies.push(new Enemy('heavy'));
            }
        }
    }

    /**
     * Main Game Loop
     */
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap delta time
        lastTime = timestamp;

        if (isRunning && !isPaused) {
            update(dt);
        }

        render();

        if (isRunning) {
            requestAnimationFrame(gameLoop);
        }
    }

    function update(dt) {
        // Update Stars
        stars.forEach(star => {
            star.y += star.speed * (1 + (score / 15000));
            if (star.y > height) {
                star.y = 0;
                star.x = Math.random() * width;
            }
        });

        // Player logic
        player.update(dt);

        // Spawns
        handleSpawns(dt);

        // Update Player Bullets
        bullets.forEach(b => b.update(dt));

        // Update Enemy Bullets
        enemyBullets.forEach(eb => eb.update(dt));

        // Update Enemies
        enemies.forEach(e => e.update(dt));

        // Update Powerups
        powerups.forEach(p => p.update(dt));

        // Update Particles
        particles.forEach(p => p.update(dt));

        // --- COLLISIONS ---

        // 1. Player Bullets vs Enemies
        bullets.forEach(b => {
            if (b.markedForDeletion) return;
            enemies.forEach(e => {
                if (e.markedForDeletion) return;
                if (checkCollision(b, e)) {
                    b.markedForDeletion = true;
                    e.takeDamage(1);
                }
            });
        });

        // 2. Enemy Bullets vs Player
        enemyBullets.forEach(eb => {
            if (eb.markedForDeletion) return;
            if (checkCollision(eb, player)) {
                eb.markedForDeletion = true;
                player.takeDamage(12);
            }
        });

        // 3. Enemies vs Player (Ramming)
        enemies.forEach(e => {
            if (e.markedForDeletion) return;
            if (checkCollision(e, player)) {
                e.destroy();
                player.takeDamage(25);
            }
        });

        // 4. Powerups vs Player
        powerups.forEach(p => {
            if (p.markedForDeletion) return;
            if (checkCollision(p, player)) {
                p.markedForDeletion = true;
                audio.playPowerup();
                if (p.type === 'health') {
                    player.hp = Math.min(player.maxHp, player.hp + 30);
                } else if (p.type === 'shield') {
                    player.shield = Math.min(player.maxShield, player.shield + 50);
                } else if (p.type === 'triple') {
                    player.tripleShotTime = 8.0; // 8 seconds triple shot
                } else if (p.type === 'rapid') {
                    player.rapidFireTime = 8.0; // 8 seconds rapid fire
                }
            }
        });

        // Cleanup
        bullets = bullets.filter(b => !b.markedForDeletion);
        enemyBullets = enemyBullets.filter(eb => !eb.markedForDeletion);
        enemies = enemies.filter(e => !e.markedForDeletion);
        powerups = powerups.filter(p => !p.markedForDeletion);
        particles = particles.filter(p => !p.markedForDeletion);

        // Update UI Status
        updateHUD();
    }

    function render() {
        // Clear Frame
        ctx.clearRect(0, 0, width, height);

        // Render Starfield Background
        stars.forEach(star => {
            ctx.fillStyle = star.color;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        // Render Particles (Behind ships)
        particles.forEach(p => p.draw());

        // Render Powerups
        powerups.forEach(p => p.draw());

        // Render Player
        if (isRunning && player) {
            player.draw();
        }

        // Render Enemies
        enemies.forEach(e => e.draw());

        // Render Bullets
        bullets.forEach(b => b.draw());
        enemyBullets.forEach(eb => eb.draw());
    }

    /**
     * HUD Overlay Updates
     */
    function updateHUD() {
        document.getElementById('score-val').innerText = score.toLocaleString();
        const hpPercent = Math.max(0, Math.round((player.hp / player.maxHp) * 100));
        document.getElementById('hp-percent').innerText = `${hpPercent}%`;
        document.getElementById('hp-bar').style.width = `${hpPercent}%`;

        // Active Powerup Tags
        const powerupContainer = document.getElementById('active-powerups');
        powerupContainer.innerHTML = '';

        if (player.shield > 0) {
            powerupContainer.innerHTML += `<span class="text-[10px] bg-purple-900/80 border border-purple-400 px-2 py-0.5 rounded text-purple-200">SHIELD</span>`;
        }
        if (player.tripleShotTime > 0) {
            powerupContainer.innerHTML += `<span class="text-[10px] bg-amber-900/80 border border-amber-400 px-2 py-0.5 rounded text-amber-200">TRIPLE (${Math.ceil(player.tripleShotTime)}s)</span>`;
        }
        if (player.rapidFireTime > 0) {
            powerupContainer.innerHTML += `<span class="text-[10px] bg-red-900/80 border border-red-400 px-2 py-0.5 rounded text-red-200">RAPID (${Math.ceil(player.rapidFireTime)}s)</span>`;
        }
    }

    /**
     * Game Controls & Handlers
     */
    function startGame() {
        audio.init();
        score = 0;
        bullets = [];
        enemyBullets = [];
        enemies = [];
        particles = [];
        powerups = [];
        initStars();

        player = new Player();

        document.getElementById('menu-overlay').classList.add('hidden');
        document.getElementById('hud-overlay').classList.remove('hidden');
        document.getElementById('touch-controls').classList.remove('hidden');

        isRunning = true;
        isPaused = false;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isRunning = false;
        audio.playExplosion('boss');

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('neon_ember_highscore', highScore);
        }

        document.getElementById('menu-title').innerText = "MISSION FAILED";
        document.getElementById('menu-subtitle').innerText = "Your fighter was destroyed";
        document.getElementById('final-score').innerText = score.toLocaleString();
        document.getElementById('high-score').innerText = highScore.toLocaleString();
        document.getElementById('score-summary').classList.remove('hidden');
        document.getElementById('start-btn').innerText = "REDEPLOY FIGHTER";

        document.getElementById('hud-overlay').classList.add('hidden');
        document.getElementById('touch-controls').classList.add('hidden');
        document.getElementById('menu-overlay').classList.remove('hidden');
    }

    function togglePause() {
        if (!isRunning) return;
        isPaused = !isPaused;
        const pauseOverlay = document.getElementById('pause-overlay');
        if (isPaused) {
            pauseOverlay.classList.remove('hidden');
        } else {
            pauseOverlay.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
    }

    // Event Listeners
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyP') togglePause();
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    // Touch Input Handlers for Mobile Smooth Control
    canvas.addEventListener('touchstart', e => {
        if (!isRunning) return;
        const touch = e.touches[0];
        touchState.active = true;
        touchState.x = touch.clientX;
        touchState.y = touch.clientY;
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
        if (!isRunning || !touchState.active) return;
        const touch = e.touches[0];
        touchState.x = touch.clientX;
        touchState.y = touch.clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
        touchState.active = false;
    });

    document.getElementById('touch-fire').addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchState.firing = true;
    });
    document.getElementById('touch-fire').addEventListener('touchend', (e) => {
        e.preventDefault();
        touchState.firing = false;
    });

    // UI Buttons
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('resume-btn').addEventListener('click', togglePause);

    // Initial setup render
    initStars();
    render();
</script>
</body>
